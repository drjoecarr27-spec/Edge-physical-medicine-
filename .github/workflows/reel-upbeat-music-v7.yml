name: Upbeat reel music assets
on:
  push:
    branches: [promo-reel-20260921]
    paths: ['.github/workflows/reel-upbeat-music-v7.yml']
permissions:
  contents: read
jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve free licensed instrumental and license record
        run: |
          mkdir -p upbeat-assets
          python3 - <<'PY'
          import urllib.request, pathlib, re, json, html
          out=pathlib.Path('upbeat-assets')
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=35) as r:return r.read()
          page='https://mixkit.co/free-stock-music/house/'
          raw=get(page).decode();(out/'source.html').write_text(raw)
          (out/'license.html').write_bytes(get('https://mixkit.co/license/'))
          urls=list(dict.fromkeys(html.unescape(x).replace('\\/','/') for x in re.findall(r'https[^\s\"<>]+?\.mp3(?:\?[^\s\"<>]*)?',raw)))
          (out/'available-music.json').write_text(json.dumps(urls,indent=2))
          chosen=[]
          for slug in ['cat-walk','techno-fest-vibes']:
            matches=[u for u in urls if slug in u]
            if not matches:continue
            u=next((u for u in matches if '/download/' in u),matches[0]);data=get(u)
            if len(data)<20000:raise RuntimeError('Invalid music file')
            name=slug+'.mp3';(out/name).write_bytes(data);chosen.append({'file':name,'url':u,'page':page,'license':'https://mixkit.co/license/#musicFree','bytes':len(data)})
          (out/'sources.json').write_text(json.dumps(chosen,indent=2));print(json.dumps({'chosen':chosen,'available':urls}))
          if not chosen:raise RuntimeError('No selected music found; inspect available-music.json')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-upbeat-music-v7
          path: upbeat-assets/
          retention-days: 7
          if-no-files-found: error
