name: Reel voice and real photos
on:
  push:
    branches: [promo-reel-20260921]
    paths: ['.github/workflows/reel-voice-and-photos.yml']
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare speech dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y espeak-ng libsndfile1
          python -m pip install -q kokoro-onnx soundfile pillow
      - name: Download real stock photos and open speech model
        run: |
          mkdir -p reel-v2
          python - <<'PY'
          import urllib.request,pathlib,concurrent.futures,json
          out=pathlib.Path('reel-v2')
          ids=[20860594,20860576,5215012,18870282,30483023]
          items={f'real-{i}.jpg':f'https://images.pexels.com/photos/{i}/pexels-photo-{i}.jpeg?auto=compress&cs=tinysrgb&w=1800' for i in ids}
          items['kokoro-v1.0.onnx']='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx'
          items['voices-v1.0.bin']='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin'
          def get(pair):
            name,url=pair
            target=pathlib.Path(name) if name.endswith(('.onnx','.bin')) else out/name
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=120) as r,open(target,'wb') as f:
              while True:
                b=r.read(1048576)
                if not b:break
                f.write(b)
            return {'file':name,'url':url,'bytes':target.stat().st_size}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:records=list(pool.map(get,items.items()))
          (out/'sources.json').write_text(json.dumps({'assets':records,'photoLicense':'https://www.pexels.com/license/','photoUse':'Illustrative stock scenes; people are not actual clinic staff or patients.','voice':'Kokoro af_sarah preset synthetic voice; Apache-2.0 model; MIT runtime','serviceSource':'https://genesis-alpha-ivory.vercel.app/services'},indent=2))
          print('Downloaded required media')
          PY
      - name: Record requested English narration
        run: |
          python - <<'PY'
          import pathlib,json,time
          import numpy as np
          import soundfile as sf
          from kokoro_onnx import Kokoro
          out=pathlib.Path('reel-v2')
          engine=Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin')
          lines=[
            ('intro','At Edge Physical Medicine, your care starts with you.'),
            ('primary-pain','We provide primary care, and pain and musculoskeletal care.'),
            ('injury-care','Auto accident and injury care, and workplace injury care.'),
            ('diagnostic-injections','Diagnostic evaluation, and injections and regenerative options, including P R P when appropriate.'),
            ('weight-hormone','Medical weight management, and hormone management.'),
            ('coordination','We also offer medical-legal coordination: clear clinical documentation, shared with your written authorization. Medical care, not legal advice.'),
            ('evaluation','Every plan begins with an individual evaluation.'),
            ('locations','Serving Cincinnati, Rose Lawn and Western Hills.'),
            ('injuries-case','Your injuries. Your case.'),
            ('call-to-action','Take the next step. Message us today to request your evaluation.')
          ]
          timing=[]
          for i,(key,text) in enumerate(lines):
            print('Generating',i,key,flush=True)
            audio,sr=engine.create(text,voice='af_sarah',speed=1.02,lang='en-us')
            audio=np.asarray(audio,dtype=np.float32)
            active=np.flatnonzero(np.abs(audio)>0.0015)
            if len(active):audio=audio[max(0,active[0]-int(.06*sr)):min(len(audio),active[-1]+int(.14*sr))]
            file=f'{i:02d}-{key}.wav'
            sf.write(out/file,audio,sr,subtype='PCM_16')
            timing.append({'id':i,'key':key,'text':text,'file':file,'duration':len(audio)/sr,'sample_rate':sr})
          (out/'narration-timing.json').write_text(json.dumps(timing,indent=2))
          (out/'voiceover.txt').write_text('\n\n'.join(t for _,t in lines))
          print(json.dumps(timing),flush=True)
          PY
      - name: Retain narration and photos for editing
        uses: actions/upload-artifact@v7
        with:
          name: edge-reel-voice-real-photos
          path: reel-v2/
          retention-days: 7
          if-no-files-found: error
