name: Live-action intersection footage
on:
  push:
    branches: [promo-reel-20260921]
    paths: ['.github/workflows/reel-real-intersection-footage-v5.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download openly licensed footage
        run: |
          mkdir -p output
          python3 - <<'PY'
          import urllib.request,pathlib,json,concurrent.futures
          rows=[('intersection-egm.webm','https://upload.wikimedia.org/wikipedia/commons/1/11/EGM_TEMMUZ_2022_Kaza_1.webm','https://commons.wikimedia.org/wiki/File:EGM_TEMMUZ_2022_Kaza_1.webm','Public domain, as marked by Wikimedia Commons'),('intersection-kranj.webm','https://upload.wikimedia.org/wikipedia/commons/6/68/Car_accident_in_Kranj_%28Slovenia%29_Rover_400_vs_Renault_Clio.webm','https://commons.wikimedia.org/wiki/File:Car_accident_in_Kranj_(Slovenia)_Rover_400_vs_Renault_Clio.webm','CC BY 3.0; DivjaSvinja; https://creativecommons.org/licenses/by/3.0/')]
          def get(row):
              name,url,page,license=row
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'EdgeMediaReview/1.0 (licensed creative project)'})
                  with urllib.request.urlopen(req,timeout=70) as r:pathlib.Path('output',name).write_bytes(r.read())
                  return {'file':name,'source':url,'page':page,'license':license,'ok':True}
              except Exception as e:return {'file':name,'source':url,'page':page,'license':license,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:results=list(pool.map(get,rows))
          pathlib.Path('output/sources.json').write_text(json.dumps(results,indent=2));print(json.dumps(results))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: edge-live-action-intersection-v5
          path: output/
          retention-days: 7
          if-no-files-found: error
