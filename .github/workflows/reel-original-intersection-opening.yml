name: Original intersection opening
on:
  push:
    branches: [promo-reel-20260921]
    paths: ['.github/workflows/reel-original-intersection-opening.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '3'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Install renderer
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y blender xvfb ffmpeg
      - name: Build original cinematic intersection animation
        run: |
          mkdir -p output/frames
          cat > scene.py <<'PY'
          import bpy, math, random, json
          from mathutils import Vector
          bpy.ops.object.select_all(action='SELECT');bpy.ops.object.delete(use_global=False)
          random.seed(19)
          scene=bpy.context.scene
          try:scene.render.engine='BLENDER_EEVEE_NEXT'
          except:scene.render.engine='BLENDER_EEVEE'
          if hasattr(scene,'eevee'):
              scene.eevee.taa_render_samples=12
              scene.eevee.use_gtao=True;scene.eevee.gtao_distance=3;scene.eevee.gtao_factor=1.25
              scene.eevee.use_soft_shadows=True
          scene.render.resolution_x=720;scene.render.resolution_y=1280;scene.render.resolution_percentage=100
          scene.render.fps=30;scene.frame_start=1;scene.frame_end=99
          scene.render.image_settings.file_format='PNG'
          scene.world.color=(.7,.78,.9)
          scene.world.use_nodes=True;scene.world.node_tree.nodes['Background'].inputs['Color'].default_value=(.69,.79,.92,1);scene.world.node_tree.nodes['Background'].inputs['Strength'].default_value=.7
          try:scene.view_settings.view_transform='AgX'
          except:scene.view_settings.view_transform='Filmic'
          def mat(n,c,metal=0,rough=.5):
              m=bpy.data.materials.new(n);m.diffuse_color=(*c,1);m.use_nodes=True;p=m.node_tree.nodes.get('Principled BSDF');p.inputs['Base Color'].default_value=(*c,1);p.inputs['Metallic'].default_value=metal;p.inputs['Roughness'].default_value=rough
              return m
          asphalt=mat('Textured asphalt',(.075,.088,.10),0,.91)
          nt=asphalt.node_tree;p=nt.nodes.get('Principled BSDF');tex=nt.nodes.new('ShaderNodeTexNoise');tex.inputs['Scale'].default_value=120
          ramp=nt.nodes.new('ShaderNodeValToRGB');ramp.color_ramp.elements[0].color=(.045,.052,.06,1);ramp.color_ramp.elements[1].color=(.16,.18,.20,1)
          nt.links.new(tex.outputs['Fac'],ramp.inputs[0]);nt.links.new(ramp.outputs['Color'],p.inputs['Base Color'])
          white=mat('Warm lane paint',(.88,.89,.85),0,.82);yellow=mat('Center line',(.98,.70,.18),0,.6)
          concrete=mat('Pale sidewalks',(.53,.55,.54),0,.92);grass=mat('Grass',(.16,.26,.15),0,.9)
          black=mat('Tires',(.012,.016,.02),0,.78);glass=mat('Smoked blue glazing',(.07,.16,.23),.6,.12);silver=mat('Brushed alloy',(.52,.58,.63),.8,.2)
          dark=mat('Trim',(.025,.04,.052),.4,.25);lamp=mat('Headlamp',(.88,.94,.98),.35,.12);red=mat('Tail light',(.55,.015,.012),.25,.18)
          def box(n,loc,scale,m,bev=0,parent=None):
              bpy.ops.mesh.primitive_cube_add(size=1,location=loc);o=bpy.context.object;o.name=n;o.dimensions=scale;bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              if m:o.data.materials.append(m)
              if bev:
                  mod=o.modifiers.new('Rounded manufacturing edges','BEVEL');mod.width=bev;mod.segments=3
                  o.modifiers.new('Weighted surface normals','WEIGHTED_NORMAL')
              if parent:o.parent=parent
              return o
          box('ground',(0,0,-.19),(150,150,.3),grass)
          box('east west road',(0,0,-.01),(130,7,.09),asphalt)
          box('north south road',(0,0,-.005),(7,130,.09),asphalt)
          for sx in [-1,1]:
              for sy in [-1,1]:
                  box('sidewalk',(sx*11.75,sy*11.75,.09),(16.3,16.3,.22),concrete,.16)
                  box('grass plot',(sx*12.1,sy*12.1,.20),(13.5,13.5,.12),grass,.1)
          for n in range(-12,13):
              k=n*3
              if abs(k)>6:
                  for j in [-.09,.09]:box('yellow lane stripe',(k,j,.05),(1.8,.07,.015),yellow);box('yellow lane stripe',(j,k,.06),(.07,1.8,.015),yellow)
          for sg in [-1,1]:
              for x in [-2.8,-2.0,-1.2,-.4,.4,1.2,2.,2.8]:
                  box('crosswalk',(x,sg*4.35,.06),(.48,1.2,.02),white)
                  box('crosswalk',(sg*4.35,x,.06),(1.2,.48,.02),white)
              box('stop line',(1.8*sg,5.35*sg,.06),(3.15,.17,.02),white)
              box('stop line',(5.35*sg,-1.8*sg,.06),(.17,3.15,.02),white)
          for idx,(x,y) in enumerate([(-13,11),(12,13),(-14,-13),(16,-12),(-24,8),(10,27)]):
              h=random.uniform(4,8);wall=mat('Building '+str(idx),[(.70,.72,.70),(.54,.43,.36),(.72,.75,.78)][idx%3])
              box('neighborhood building',(x,y,h/2+.2),(7,7,h),wall,.10)
              box('flat roof',(x,y,h+.25),(7.4,7.4,.3),dark,.05)
              for z in [1.7,3.7,5.7]:
                  if z>h-1:continue
                  for xx in [-2.3,0,2.3]:
                      box('glass window',(x+xx,y-3.515,z),(1.1,.035,1.4),glass,.035)
                      box('glass window',(x-3.515,y+xx,z),(.035,1.1,1.4),glass,.035)
          for x,y in [(-7,10),(8,8),(-9,-8),(8,-9),(17,8),(-8,19),(6,17)]:
              bark=mat('bark'+str(x)+str(y),(.22,.15,.095),0,.9)
              box('tree trunk',(x,y,1.3),(.23,.23,2.6),bark,.08)
              bpy.ops.mesh.primitive_uv_sphere_add(segments=12,ring_count=8,location=(x,y,3.1));o=bpy.context.object;o.scale=(1.35,1.35,1.8);o.data.materials.append(mat('leaves'+str(x)+str(y),(.15+random.random()*.035,.29,.16),0,.93))
          def mesh(n,v,f,m,parent=None):
              me=bpy.data.meshes.new(n);me.from_pydata(v,[],f);me.update();ob=bpy.data.objects.new(n,me);bpy.context.collection.objects.link(ob);ob.data.materials.append(m)
              for p in ob.data.polygons:p.use_smooth=True
              b=ob.modifiers.new('Subtle surface bevel','BEVEL');b.width=.035;b.segments=3;ob.modifiers.new('Surface normals','WEIGHTED_NORMAL')
              if parent:ob.parent=parent
              return ob
          def sedan(name,color):
              root=bpy.data.objects.new(name,None);bpy.context.collection.objects.link(root)
              paint=mat(name+' automotive paint',color,.6,.23)
              # Silhouette: long bonnet, short rear deck, naturally sloped pillars.
              rings=[(-2.18,.72,.49,.72),(-1.80,.88,.46,.91),(-.95,.91,.43,1.00),(.60,.91,.43,.97),(1.50,.87,.48,.91),(2.15,.75,.55,.77)]
              verts=[]
              for x,w,z0,z1 in rings:verts += [(x,-w,z0),(x,w,z0),(x,w,z1),(x,-w,z1)]
              faces=[(3,2,1,0),(20,21,22,23)]
              for i in range(len(rings)-1):
                  for j in range(4):faces.append((i*4+j,i*4+(j+1)%4,(i+1)*4+(j+1)%4,(i+1)*4+j))
              body=mesh(name+' body',verts,faces,paint,root)
              # Cabin glazing, white pillars and body-colored roof.
              v=[(-1.28,-.80,.96),(-1.28,.80,.96),(.95,.80,.96),(.95,-.80,.96),(-.70,-.65,1.55),(-.70,.65,1.55),(.35,.65,1.53),(.35,-.65,1.53)]
              mesh(name+' windows',v,[(0,1,5,4),(1,2,6,5),(2,3,7,6),(3,0,4,7)],glass,root)
              mesh(name+' roof',[(-.76,-.67,1.57),(-.76,.67,1.57),(.38,.67,1.55),(.38,-.67,1.55)],[(0,1,2,3)],paint,root)
              for y in [-.77,.77]:
                  pillar=box('door pillar',(-.10,y,1.21),(.07,.045,.50),paint,.018,root)
                  box('door handle',(-.69,y*1.18,.90),(.19,.034,.045),silver,.015,root)
                  box('door handle',(.38,y*1.18,.90),(.19,.034,.045),silver,.015,root)
                  box('mirror',(.74,y*1.25,1.01),(.26,.17,.14),paint,.07,root)
                  box('sill',(0,y*1.16,.52),(3,.08,.09),dark,.025,root)
              box('front lower grille',(2.10,0,.61),(.08,1.03,.19),dark,.04,root)
              box('rear bumper',(-2.14,0,.56),(.08,1.37,.11),dark,.035,root)
              for y in [-.55,.55]:
                  box('headlamp',(2.09,y,.78),(.13,.33,.115),lamp,.035,root)
                  box('red taillamp',(-2.12,y,.78),(.12,.28,.10),red,.025,root)
              wheels=[]
              for x in [-1.36,1.34]:
                  for y in [-.91,.91]:
                      bpy.ops.mesh.primitive_cylinder_add(vertices=32,radius=.345,depth=.22,location=(x,y,.38),rotation=(math.pi/2,0,0));o=bpy.context.object;o.name='Rubber wheel';o.data.materials.append(black);o.parent=root
                      b=o.modifiers.new('Tire rounding','BEVEL');b.width=.045;b.segments=3
                      for p in o.data.polygons:p.use_smooth=True
                      bpy.ops.mesh.primitive_cylinder_add(vertices=24,radius=.235,depth=.231,location=(x,y,.38),rotation=(math.pi/2,0,0));o=bpy.context.object;o.data.materials.append(silver);o.parent=root
                      for a in range(5):
                          spoke=box('wheel spoke',(x,y+(.122 if y>0 else -.122),.38),(.055,.025,.44),dark,.01,root);spoke.rotation_euler[1]=a*math.pi/5
              return root,body
          a,abody=sedan('Silver sedan',(.76,.80,.83));b,bbody=sedan('Blue sedan',(.025,.13,.26));b.rotation_euler.z=-math.pi/2
          # Keyframed approach and restrained impact; no people, emergency vehicles or racing.
          poses=[(1,(-12.4,-1.20,0),(.80,12.,0),0.,-math.pi/2),(65,(-2.38,-1.20,0),(.80,-.30,0),0.,-math.pi/2),(70,(-2.08,-1.18,0),(1.18,-.58,0),.015,-math.pi/2-.09),(83,(-1.87,-1.11,0),(1.80,-.92,0),.06,-math.pi/2-.23),(99,(-1.87,-1.11,0),(1.80,-.92,0),.06,-math.pi/2-.23)]
          for f,pa,pb,ra,rb in poses:
              for car,p,r in [(a,pa,ra),(b,pb,rb)]:
                  car.location=p;car.rotation_euler.z=r;car.keyframe_insert(data_path='location',frame=f);car.keyframe_insert(data_path='rotation_euler',frame=f)
          for car in [a,b]:
              for fc in car.animation_data.action.fcurves:
                  for k in fc.keyframe_points:k.interpolation='LINEAR'
          abody.shape_key_add(name='Basis');damage=abody.shape_key_add(name='Impact compression')
          for v in damage.data:
              if v.co.x>1.40:v.co.x-=.22*((v.co.x-1.40)/.75);v.co.z+=.08*((v.co.x-1.4)/.75)
          damage.value=0;damage.keyframe_insert(data_path='value',frame=64);damage.value=1;damage.keyframe_insert(data_path='value',frame=70)
          for j in range(9):
              ob=box('small impact fragment',(-.12,-1.1,.22),(.035,.08,.02),dark,.005)
              ob.scale=(0,0,0);ob.keyframe_insert(data_path='scale',frame=64)
              ob.scale=(1,1,1);ob.keyframe_insert(data_path='scale',frame=66);ob.keyframe_insert(data_path='location',frame=65)
              ob.location=(.2+random.random()*1.6,-1.1+random.uniform(-1.4,1.4),.055);ob.rotation_euler=(0,0,random.random()*6);ob.keyframe_insert(data_path='location',frame=85);ob.keyframe_insert(data_path='rotation_euler',frame=85)
          bpy.ops.object.light_add(type='SUN',location=(-8,-10,14));light=bpy.context.object;light.rotation_euler=(math.radians(25),math.radians(-20),math.radians(-35));light.data.energy=2.3;light.data.angle=.16
          bpy.ops.object.light_add(type='AREA',location=(2,-3,10));bpy.context.object.data.energy=900;bpy.context.object.data.shape='DISK';bpy.context.object.data.size=10
          bpy.ops.object.camera_add(location=(10,-13.8,11.5));cam=bpy.context.object;scene.camera=cam;cam.data.lens=40
          for f,pos in [(1,(11.2,-14.6,12.4)),(64,(9.7,-12.8,10.8)),(67,(9.63,-12.72,10.75)),(70,(9.76,-12.84,10.83)),(99,(9.5,-12.4,10.7))]:
              cam.location=pos;direction=Vector((-.3,.1,.65))-cam.location;cam.rotation_euler=direction.to_track_quat('-Z','Y').to_euler();cam.keyframe_insert(data_path='location',frame=f);cam.keyframe_insert(data_path='rotation_euler',frame=f)
          scene.render.filepath='output/frames/'
          bpy.ops.wm.save_as_mainfile(filepath='output/intersection.blend')
          bpy.ops.render.render(animation=True)
          PY
          xvfb-run -a blender -b -t 3 --python scene.py > output/render.log 2>&1
      - name: Encode 3.3 second original opening
        run: |
          ffmpeg -v error -y -framerate 30 -i output/frames/%04d.png -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p -movflags +faststart output/intersection-original.mp4
          printf '%s\n' 'Original 3D reenactment made for this reel. No YouTube footage, brands, real patients or copied soundtrack. Impact at frame 65 (2.133 seconds); duration 3.3 seconds.' > output/README.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-original-intersection
          path: |
            output/intersection-original.mp4
            output/frames/0001.png
            output/frames/0040.png
            output/frames/0065.png
            output/frames/0085.png
            output/render.log
            output/README.txt
          retention-days: 7
          if-no-files-found: error
