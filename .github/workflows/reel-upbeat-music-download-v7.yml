name: Download upbeat reel music
on:
  push:
    branches: [promo-reel-20260921]
    paths: ['.github/workflows/reel-upbeat-music-download-v7.yml']
permissions:
  contents: read
jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download music from URLs present on the Mixkit library page
        run: |
          mkdir -p music
          python3 - <<'PY'
          import urllib.request,pathlib,json
          out=pathlib.Path('music');records=[]
          for name,author,id in [('Cat Walk','Arulo',371),('Techno Fest Vibes','Alejandro Magana',124)]:
            url=f'https://assets.mixkit.co/music/{id}/{id}.mp3'
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as r:data=r.read()
            path=out/(name.lower().replace(' ','-')+'.mp3');path.write_bytes(data)
            records.append({'title':name,'author':author,'url':url,'file':path.name,'page':'https://mixkit.co/free-stock-music/house/','license':'https://mixkit.co/license/#musicFree','bytes':len(data)})
          (out/'sources.json').write_text(json.dumps(records,indent=2))
          for label,url in [('download-details','https://mixkit.co/free-stock-music/download/371/?context=item+grid'),('license','https://mixkit.co/license/')]:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:(out/(label+'.html')).write_bytes(r.read())
          print(json.dumps(records))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-upbeat-music-ready-v7
          path: music/
          retention-days: 7
          if-no-files-found: error
