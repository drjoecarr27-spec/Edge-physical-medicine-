name: Reel care evidence addition
on:
  push:
    branches: [promo-reel-20260921]
    paths: ['.github/workflows/reel-care-evidence-addition.yml']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare open-source speech
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y espeak-ng libsndfile1
          python -m pip install -q kokoro-onnx soundfile requests
      - name: Record updated message
        run: |
          mkdir -p evidence-addition
          python - <<'PY'
          import requests,pathlib,json,numpy as np,soundfile as sf
          from kokoro_onnx import Kokoro
          for name in ['kokoro-v1.0.onnx','voices-v1.0.bin']:
            with requests.get('https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/'+name,timeout=120,stream=True) as r:
              r.raise_for_status()
              with open(name,'wb') as f:
                for b in r.iter_content(1048576): f.write(b)
          engine=Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin')
          lines=[
            ('04-care-evidence',"That's what we do: personalized care with rigorous clinical documentation."),
            ('05-record',"We record your symptoms, examination findings, and how your injuries affect your life."),
            ('06-evidence',"Clear medical evidence helps others understand what happened to you."),
            ('07-fair',"You deserve to have your injuries taken seriously and your claim evaluated fairly."),
            ('10-action',"Get evaluated. Get it documented. Message us today to request your evaluation.")
          ]
          timing=[]
          for key,text in lines:
            audio,sr=engine.create(text,voice='af_sarah',speed=1.04,lang='en-us')
            audio=np.asarray(audio,dtype=np.float32)
            active=np.flatnonzero(np.abs(audio)>.0015)
            if len(active): audio=audio[max(0,active[0]-int(.05*sr)):min(len(audio),active[-1]+int(.13*sr))]
            sf.write('evidence-addition/'+key+'.wav',audio,sr,subtype='PCM_16')
            timing.append({'key':key,'text':text,'file':key+'.wav','duration':len(audio)/sr})
          pathlib.Path('evidence-addition/timing.json').write_text(json.dumps(timing,indent=2))
          pathlib.Path('evidence-addition/script.txt').write_text('\n'.join(t for _,t in lines)+'\nVoice: synthetic af_sarah preset, not a cloned voice.\n')
          print(json.dumps(timing))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: edge-care-evidence-addition
          path: evidence-addition/
          retention-days: 7
          if-no-files-found: error
